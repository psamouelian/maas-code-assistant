{{- if .Values.removeKubeAdmin }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remove-kubeadmin
  namespace: kube-system
  labels:
    {{- include "maas-code-assistant.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: remove-kubeadmin
  namespace: kube-system
  labels:
    {{- include "maas-code-assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: remove-kubeadmin
    namespace: kube-system
---
# Read-only cluster access so the job can VERIFY that the SSO admin path is
# fully wired before it deletes the last break-glass credential (kubeadmin).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: remove-kubeadmin-verify
  labels:
    {{- include "maas-code-assistant.labels" . | nindent 4 }}
rules:
  - apiGroups: ["config.openshift.io"]
    resources: ["oauths"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get"]
  - apiGroups: ["k8s.keycloak.org"]
    resources: ["keycloaks", "keycloakrealmimports"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: remove-kubeadmin-verify
  labels:
    {{- include "maas-code-assistant.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: remove-kubeadmin-verify
subjects:
  - kind: ServiceAccount
    name: remove-kubeadmin
    namespace: kube-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: remove-kubeadmin
  namespace: kube-system
  labels:
    {{- include "maas-code-assistant.labels" . | nindent 4 }}
  annotations:
    # Weight ensures this runs AFTER the oauth patch hook (weight 0) so the
    # rhbk IDP is already registered when we verify it.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccount: remove-kubeadmin
      serviceAccountName: remove-kubeadmin
      restartPolicy: Never
      containers:
      - name: remove-kubeadmin
        image: {{ .Values.global.toolsImage }}
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash"]
        args:
          - -ec
          - |-
            echo "Verifying the SSO admin path is healthy before removing kubeadmin..."

            # Poll for up to ~10 minutes for ALL conditions to hold. If the SSO
            # admin path never becomes healthy we REFUSE to delete kubeadmin and
            # fail the hook, leaving the break-glass credential intact.
            deadline=$(( $(date +%s) + 600 ))
            reason=""
            while :; do
              reason=""

              # 1. rhbk identity provider must be registered on the cluster OAuth.
              if ! oc get oauth cluster -o jsonpath='{.spec.identityProviders[*].name}' 2>/dev/null | tr ' ' '\n' | grep -qx rhbk; then
                reason="rhbk identity provider is not registered on the cluster OAuth"
              # 2. The cluster-admin binding for the SSO admin group must exist.
              elif ! oc get clusterrolebinding keycloak-cluster-admins >/dev/null 2>&1; then
                reason="keycloak-cluster-admins ClusterRoleBinding is missing"
              # 3. Keycloak must be Ready.
              elif [ "$(oc get keycloak {{ .Values.name }} -n {{ .Values.namespace }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null)" != "True" ]; then
                reason="Keycloak instance is not Ready"
              # 4. The realm import must have completed.
              elif [ "$(oc get keycloakrealmimport {{ .Values.realm.name }} -n {{ .Values.namespace }} -o jsonpath='{.status.conditions[?(@.type=="Done")].status}' 2>/dev/null)" != "True" ]; then
                reason="KeycloakRealmImport has not completed"
              else
                break
              fi

              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "REFUSING to remove kubeadmin: ${reason} (timed out waiting for the SSO admin path to become healthy)." >&2
                echo "kubeadmin has been PRESERVED so you are not locked out." >&2
                exit 1
              fi
              echo "  waiting: ${reason}..."
              sleep 15
            done

            echo "SSO admin path verified. Removing kubeadmin secret."
            oc delete secret kubeadmin -n kube-system ||:
{{- end }}
